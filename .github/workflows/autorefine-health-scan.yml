name: "autoRefine — Daily Health Scan"

on:
  schedule:
    # Daily at 06:00 UTC (was agentMode nauro_health_scan timer). It ran twice a day for
    # no reason anyone recorded; a daily scan is what the name promises and what the
    # report is read as.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read and analyze only: no report/issue writes or Telegram sends (AI usage still billed)'
        type: boolean
        default: false

permissions:
  contents: read
  # Required by azure/login's OIDC flow, and by nothing else here. It only lets the job
  # mint a GitHub-signed identity token for the "Azure login" step to exchange with
  # Entra ID; it grants no additional access to this repository's contents or metadata.
  id-token: write

jobs:
  health-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Honor budget tier (set by .github/azure-budget-tier.yml):
    #   - "critical" → skip scheduled runs (workflow_dispatch still works)
    #   - cadence_per_day=1 → skip the 18:00 UTC slot, keep 06:00 only
    if: |
      (vars.AUTOREFINE_TIER != 'critical' || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch'
          || vars.AUTOREFINE_CADENCE == '2'
          || (vars.AUTOREFINE_CADENCE != '2' && startsWith(github.event.schedule, '0 6'))
          || vars.AUTOREFINE_CADENCE == '' )
    env:
      AUTOREFINE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
      NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
      # Model is governed by the daily Azure Budget Tier workflow.
      # Override by setting the ``HEALTH_SCAN_MODEL`` repo variable directly,
      # or by changing the tier thresholds in ``scripts/azure-budget-tier.py``.
      HEALTH_SCAN_MODEL: ${{ vars.HEALTH_SCAN_MODEL || 'gpt-4o-mini' }}
      AUTOREFINE_TIER: ${{ vars.AUTOREFINE_TIER || 'normal' }}
    steps:
      - name: Checkout autoRefine
        uses: actions/checkout@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Checkout governance (for manifest)
        uses: actions/checkout@v5
        with:
          repository: samoletovs/nauroLabs-github
          path: .github-gov
          token: ${{ secrets.GH_PAT }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Azure OIDC prerequisites
        id: azure-prerequisites
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            printf 'missing=%s\n' "${missing[*]}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing Azure OIDC repository secrets: ${missing[*]}. Configure the identity and federated credential before rerunning."
            exit 1
          fi

      # OIDC, not a service-principal secret. See the matching step in
      # autorefine-evaluate.yml — the AZURE_CREDENTIALS secret this used to read has
      # never existed. Still inert until AZURE_CLIENT_ID and AZURE_TENANT_ID are created.
      #
      # This job needs three scopes and `az login` caches only one of them, so it is the
      # riskier of the two under OIDC — and it has never run to prove otherwise (every
      # run since AUTOREFINE_TIER went to 'critical' has been skipped). The analyst call
      # in particular happens after all the data gathering, well past the 5 minutes
      # GitHub's federated token lasts (Azure/azure-cli#28708). Pre-warmed below.
      - name: Azure login
        id: azure-login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # See the matching step in autorefine-evaluate.yml for why this exists and why it
      # uses `--resource` rather than `--scope`. The three here are ARM for Cost
      # Management, api.loganalytics.io for App Insights telemetry, and cognitiveservices
      # for the Azure OpenAI analyst — the scopes named in agent/health_scan.py. A
      # service this job starts calling in future needs adding here too, and nothing
      # checks that for you: the scope a client asks for is usually an SDK default
      # rather than a string in our code, so it cannot be derived by reading the source.
      - name: Pre-warm Azure token cache
        run: |
          for resource in https://management.azure.com https://api.loganalytics.io https://cognitiveservices.azure.com; do
            az account get-access-token --resource "$resource" --output none \
              || echo "::warning::Could not pre-warm $resource — a later token request may fail with AADSTS700024"
          done

      - name: Run health scan
        id: health-scan
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set --
          if [ "${AUTOREFINE_DRY_RUN:-false}" = "true" ]; then
            set -- --dry-run
          fi
          scan_status=0
          python -m agent.main \
            --manifest .github-gov/config/workspace-manifest.json \
            --mode health-scan \
            "$@" \
            > autorefine-health.json 2>&1 || scan_status=$?

          echo "--- health-scan output ---"
          cat autorefine-health.json
          exit "$scan_status"

      # Free ride. The PR-approval sweep is a few seconds of GitHub API calls, but as
      # its own scheduled workflow every run pays a whole billed minute — 230 runs cost
      # 230 minutes. This job has already paid for its checkout, its Python and its
      # dependencies, so running the sweep here costs nothing measurable and lets
      # pr-ready-cards.yml drop to a single scheduled sweep a day without doubling the
      # wait for a card. `always()` so a failed scan above still gets the PRs carded.
      - name: Sweep and card ready Copilot PRs
        id: pr-sweep
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set --
          if [ "${AUTOREFINE_DRY_RUN:-false}" = "true" ]; then
            set -- --dry-run
          fi
          python -m agent.main \
            --manifest .github-gov/config/workspace-manifest.json \
            --mode pr-cards \
            "$@"

      - name: Failure notification
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          OIDC_STATUS: ${{ steps.azure-prerequisites.outcome }}
          AZURE_LOGIN_STATUS: ${{ steps.azure-login.outcome }}
          SCAN_STATUS: ${{ steps.health-scan.outcome }}
          PR_SWEEP_STATUS: ${{ steps.pr-sweep.outcome }}
          AZURE_OIDC_MISSING: ${{ steps.azure-prerequisites.outputs.missing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NAURO_BOT_TOKEN" ] || [ -z "$NAURO_CHAT_ID" ]; then
            echo "::error::Telegram failure notification requires NAURO_BOT_TOKEN and NAURO_CHAT_ID"
            exit 1
          fi
          stage_status() {
            case "$1" in
              success) echo "succeeded" ;;
              failure) echo "failed" ;;
              cancelled) echo "cancelled" ;;
              skipped|"") echo "not run" ;;
              *) echo "unknown" ;;
            esac
          }
          message="❌ autoRefine daily scan failed"
          if [ "$OIDC_STATUS" = "failure" ]; then
            message+=$'\n'"Missing Azure OIDC settings: ${AZURE_OIDC_MISSING:-unknown}. Operator configuration required."
          elif [ "$AZURE_LOGIN_STATUS" = "failure" ]; then
            message+=$'\n'"Azure login failed — verify the configured identity and repository federation."
          elif [ "$AZURE_LOGIN_STATUS" != "success" ]; then
            message+=$'\n'"Setup failed before Azure login."
          fi
          message+=$'\n'"Health scan: $(stage_status "$SCAN_STATUS")"
          message+=$'\n'"PR-card sweep: $(stage_status "$PR_SWEEP_STATUS")"
          message+=$'\n'"Run: $RUN_URL"
          bash scripts/notify-telegram.sh --plain "$message"
