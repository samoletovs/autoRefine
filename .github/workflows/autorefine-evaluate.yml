name: "autoRefine — Evaluate All Projects"

on:
  # The daily 06:00 UTC schedule moved to the Azure Container Apps job `job-autorefine`
  # (infrastructure/main.bicep). This workflow averaged 43 min/run — ~1,744 Actions minutes
  # a month, by far the largest consumer across every repo.
  #
  # Kept dispatch-only so a run can be triggered by hand from the GitHub UI. That path
  # was dead until now: the "Azure login" step read a repository secret named
  # AZURE_CREDENTIALS which does not exist, so `creds:` resolved to empty, the action
  # fell through to service-principal auth with nothing to use, and every dispatch died
  # with "Ensure 'client-id' and 'tenant-id' are supplied" before the agent started.
  #
  # It now authenticates with OIDC federated credentials instead — no long-lived secret
  # to rotate or leak. That needs `id-token: write` below, plus two repository secrets,
  # AZURE_CLIENT_ID and AZURE_TENANT_ID, pointing at an Entra app whose federated
  # credential trusts this repository. Until a human creates those two secrets the login
  # step still fails, with the same message: this workflow is inert, not fixed.
  #
  # The scheduled Container Apps job is unaffected: it authenticates with a
  # system-assigned managed identity and needs no secret at all.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'file-ideas'
        type: choice
        options:
          - file-ideas
          - plan
          - evaluate
      repo:
        description: 'Single repo to evaluate (leave empty for all)'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  # Required by azure/login's OIDC flow, and by nothing else here. It only lets the job
  # mint a GitHub-signed identity token for the "Azure login" step to exchange with
  # Entra ID; it grants no additional access to this repository's contents or metadata.
  id-token: write

# One sweep at a time. A run holds a Foundry agent open for ~43 min (AGENTS.md)
# and re-reads every project in the manifest, so two dispatches at once buy two
# full bills for one answer.
#
# cancel-in-progress is deliberately false. agent/main.py deletes its ephemeral
# Foundry agent in a `finally` block, and a cancelled job is a hard kill that
# never reaches it — cancelling would save an Actions minute and leak an agent
# that then survives until the next run's sweep_orphaned_agents clears it.
concurrency:
  group: autorefine-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # This job's failure mode is hanging on a Foundry call, not crashing, and the
    # default ceiling is GitHub's 6 hours — eight normal runs' worth of minutes on
    # the workflow AGENTS.md already names as the fleet's largest consumer. A sweep
    # averages ~43 min, so 90 absorbs a slow day and still stops a hang dead.
    timeout-minutes: 90
    # Inert while this workflow is dispatch-only: github.event_name can only be
    # 'workflow_dispatch' here, so the right-hand side is always true and the tier
    # never gates anything. Kept rather than deleted so the budget gate is already
    # correct on the day the 06:00 schedule comes back to Actions.
    if: vars.AUTOREFINE_TIER != 'critical' || github.event_name == 'workflow_dispatch'
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
      NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
      AUTOREFINE_TIER: ${{ vars.AUTOREFINE_TIER || 'normal' }}
    steps:
      - name: Checkout autoRefine
        uses: actions/checkout@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Checkout governance (for manifest)
        uses: actions/checkout@v5
        with:
          repository: samoletovs/nauroLabs-github
          path: .github-gov
          token: ${{ secrets.GH_PAT }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: pip install -r requirements.txt

      # OIDC, not a service-principal secret. With no client-secret supplied, azure/login
      # runs `az login --service-principal --federated-token <github-oidc-jwt>`, which
      # leaves an authenticated Azure CLI on the runner. That CLI session is the whole
      # handoff: the action exports no environment variables (there is no exportVariable
      # call anywhere in Azure/login), so the Python below reaches Azure through
      # DefaultAzureCredential's AzureCliCredential link, not EnvironmentCredential.
      #
      # Keep this step immediately before the pre-warm below. GitHub's identity token
      # expires 5 minutes after it is minted and the Azure CLI cannot mint another
      # (Azure/azure-cli#28708), so anything slow inserted between them spends a window
      # the agent needs. `az login` caches only an ARM token.
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Buy every token the sweep needs while the federated token is still valid.
      #
      # Without this the agent's first Foundry call is a fresh round-trip that
      # re-presents the federated token, and whether it succeeds depends on how long
      # `pip install` happened to take. It works today by luck of step order, not by
      # design. Acquiring the token here puts it in ~/.azure/msal_token_cache.json,
      # where the Python finds it without presenting an assertion at all.
      #
      # `--resource`, not `--scope`, on purpose: this is character-for-character the
      # command azure-identity's AzureCliCredential runs — it strips the '/.default'
      # suffix and passes `--resource` — so this writes the cache entry it will later
      # look for, rather than one that merely ought to normalise to the same key.
      #
      # https://ai.azure.com is the AgentsClient default scope; ARM is what `az login`
      # already holds, re-taken here so the whole set shares one expiry.
      #
      # Fail-open and quiet. `--output none` keeps tokens out of the log, and the
      # fallback keeps a diagnostic from killing the ~43 minutes of work it exists to
      # protect: if this step cannot pre-warm, the run proceeds exactly as it would
      # have without it, and says so.
      - name: Pre-warm Azure token cache
        run: |
          for resource in https://ai.azure.com https://management.azure.com; do
            az account get-access-token --resource "$resource" --output none \
              || echo "::warning::Could not pre-warm $resource — a later token request may fail with AADSTS700024"
          done

      - name: Run autoRefine
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Observe-first: propose functional ideas (log + Telegram, file NOTHING) until a
          # human sets repo variable AUTOREFINE_FUNCTIONAL_MODE=file. See EVOLUTION.md §6.
          AUTOREFINE_FUNCTIONAL_MODE: ${{ vars.AUTOREFINE_FUNCTIONAL_MODE || 'propose' }}
          # Dispatch inputs arrive as env vars, not as inline ${{ }} inside the script.
          # Actions substitutes an expression textually before bash parses the line, so
          # an inline `repo` would be spliced in as shell *syntax* — quoting at the call
          # site cannot help, because the quotes are written after the payload is. As env
          # vars they are only ever data. pr-merged-notify.yml uses the same pattern.
          MODE: ${{ github.event.inputs.mode || 'file-ideas' }}
          REPO_INPUT: ${{ github.event.inputs.repo }}
        run: |
          if [ -n "$REPO_INPUT" ]; then
            set -- --repo "samoletovs/$REPO_INPUT"
          else
            set -- --manifest .github-gov/config/workspace-manifest.json
          fi

          python -m agent.main "$@" --mode "$MODE" \
            --workdir /tmp/autorefine \
            > /tmp/autorefine-report.json 2>/tmp/autorefine-logs.txt || true

          echo "--- logs ---"
          cat /tmp/autorefine-logs.txt
          echo "--- report ---"
          cat /tmp/autorefine-report.json

      # Writes scores/total/avg to $GITHUB_OUTPUT, or exits 1 when the report holds no
      # score objects. continue-on-error keeps `outcome` truthful (that is the signal the
      # steps below branch on) while letting the notifier and issue-filer still run.
      #
      # The arithmetic lives in Python because it was wrong for as long as it lived in a
      # jq pipeline here: `total` was measured after `head -20` truncated the list, so a
      # 25-project manifest reported "20 projects" beside an average over all 25.
      - name: Parse scores
        id: parse-scores
        continue-on-error: true
        run: python3 -m agent.score_summary /tmp/autorefine-report.json

      - name: Create or update failure issue
        id: failure-issue
        if: steps.parse-scores.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ github.event.inputs.mode || 'file-ideas' }}
        run: |
          set -e
          TITLE="[autopilot] autoRefine evaluate workflow failing (${MODE})"

          # Read last 60 lines of logs/report for context, redact obvious noise.
          LOGS_TAIL=$(tail -n 60 /tmp/autorefine-logs.txt 2>/dev/null || echo "(no logs)")
          REPORT_HEAD=$(head -c 4000 /tmp/autorefine-report.json 2>/dev/null || echo "(no report)")

          BODY=$(cat <<EOF
          The \`autoRefine — Evaluate All Projects\` workflow failed: no score
          objects were parsed from the report.

          - Mode: \`${MODE}\`
          - Run: ${RUN_URL}
          - Trigger: \`${{ github.event_name }}\`

          ### Last 60 log lines
          \`\`\`
          ${LOGS_TAIL}
          \`\`\`

          ### Report (first 4 KB)
          \`\`\`json
          ${REPORT_HEAD}
          \`\`\`

          ### What to investigate
          1. Why does \`agent/parse_scores.py\` find no objects with both \`project\` and \`score\`
             in the report that \`agent/score_summary.py\` read?
          2. Does the current \`${MODE}\` mode actually emit \`score\` fields? If not, either
             update the mode to emit them, or change the workflow's "Notify Telegram" / issue
             logic so this mode isn't expected to produce scores.
          3. Add a test under \`tests/\` that locks the contract.

          _Auto-filed by the workflow itself. Closing duplicates is fine — a new one will
          be opened on the next failure if the underlying issue isn't fixed._
          EOF
          )

          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "in:title \"autoRefine evaluate workflow failing\"" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" \
              --repo "${{ github.repository }}" \
              --body "🔁 Failed again — see ${RUN_URL}"
            URL=$(gh issue view "$EXISTING" --repo "${{ github.repository }}" --json url --jq .url)
          else
            echo "Creating new failure issue"
            URL=$(gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --label "autopilot,bug" \
              --body "$BODY")
            NUM=$(echo "$URL" | awk -F/ '{print $NF}')
            gh issue edit "$NUM" \
              --repo "${{ github.repository }}" \
              --add-assignee "Copilot" \
              || echo "::warning::Could not assign Copilot to #$NUM — Copilot Coding Agent may not be enabled"
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        env:
          SCORES: ${{ steps.parse-scores.outputs.scores }}
          TOTAL: ${{ steps.parse-scores.outputs.total }}
          AVG: ${{ steps.parse-scores.outputs.avg }}
          MODE: ${{ github.event.inputs.mode || 'file-ideas' }}
          STATUS: ${{ steps.parse-scores.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_URL: ${{ steps.failure-issue.outputs.url }}
        run: |
          if [ -z "$NAURO_BOT_TOKEN" ] || [ -z "$NAURO_CHAT_ID" ]; then
            echo "NAURO_BOT_TOKEN or NAURO_CHAT_ID not set; skipping"
            exit 0
          fi
          python3 agent/workflow_notify.py || echo "::warning::Telegram notification failed"

      - name: Fail job if parsing failed
        if: steps.parse-scores.outcome == 'failure'
        run: |
          echo "::error::Parse scores step failed — see issue ${{ steps.failure-issue.outputs.url }}"
          exit 1
