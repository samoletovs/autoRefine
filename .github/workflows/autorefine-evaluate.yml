name: "autoRefine — Evaluate All Projects"

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'file-ideas'
        type: choice
        options:
          - file-ideas
          - plan
          - evaluate
      repo:
        description: 'Single repo to evaluate (leave empty for all)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
      NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
    steps:
      - name: Checkout autoRefine
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Checkout governance (for manifest)
        uses: actions/checkout@v4
        with:
          repository: samoletovs/nauroLabs-github
          path: .github-gov
          token: ${{ secrets.GH_PAT }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run autoRefine
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          MODE="${{ github.event.inputs.mode || 'file-ideas' }}"
          REPO_FLAG=""
          if [ -n "${{ github.event.inputs.repo }}" ]; then
            REPO_FLAG="--repo samoletovs/${{ github.event.inputs.repo }}"
          else
            REPO_FLAG="--manifest .github-gov/config/workspace-manifest.json"
          fi

          python -m agent.main $REPO_FLAG --mode $MODE \
            --workdir /tmp/autorefine \
            > /tmp/autorefine-report.json 2>/tmp/autorefine-logs.txt || true

          echo "--- logs ---"
          cat /tmp/autorefine-logs.txt
          echo "--- report ---"
          cat /tmp/autorefine-report.json

      - name: Parse scores
        id: parse-scores
        run: |
          report_file="/tmp/autorefine-report.json"

          # Extract only project evaluation JSON objects (has both "score" and "project").
          # Python handles mixed output (plan mode emits "--- IMPROVEMENT PLAN ---" too).
          REPORT_OBJECTS=$(python3 -c "
import sys, json
dec = json.JSONDecoder()
with open(sys.argv[1]) as f:
    content = f.read()
idx = 0
while idx < len(content):
    try:
        obj, size = dec.raw_decode(content, idx)
        if isinstance(obj, dict) and 'score' in obj and 'project' in obj:
            print(json.dumps(obj))
        idx += size
    except json.JSONDecodeError:
        idx += 1
" "$report_file")

          if [ -z "$REPORT_OBJECTS" ]; then
            echo "::error::No score found in $report_file"
            exit 1
          fi

          # Use jq to format scores and compute average (handles float scores like 72.5)
          SCORES=$(echo "$REPORT_OBJECTS" | jq -r '"\(.project): \(.score)/100"' | head -20)
          TOTAL=$(echo "$SCORES" | wc -l)
          AVG=$(echo "$REPORT_OBJECTS" | jq -rs '[.[].score] | add / length | floor | tostring')

          {
            printf 'scores<<EOF\n%s\nEOF\n' "$SCORES"
            printf 'total=%s\n' "$TOTAL"
            printf 'avg=%s\n' "$AVG"
            printf 'score=%s\n' "$AVG"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        env:
          SCORES: ${{ steps.parse-scores.outputs.scores }}
          TOTAL: ${{ steps.parse-scores.outputs.total }}
          AVG: ${{ steps.parse-scores.outputs.avg }}
        run: |
          if [ -z "$NAURO_BOT_TOKEN" ] || [ -z "$NAURO_CHAT_ID" ]; then
            echo "NAURO_BOT_TOKEN or NAURO_CHAT_ID not set; skipping"
            exit 0
          fi

          python3 - <<'PY' || echo "::warning::Telegram notification failed"
          import os, sys
          # Make agent.notify importable from the repo root
          sys.path.insert(0, os.getcwd())
          from agent.notify import send_telegram

          scores = os.environ.get("SCORES", "No data")
          total = os.environ.get("TOTAL", "?")
          avg = os.environ.get("AVG", "?")
          mode = "${{ github.event.inputs.mode || 'file-ideas' }}"

          msg = f"🔧 <b>autoRefine</b> daily {mode}\n\n"
          msg += f"📊 {total} projects, avg {avg}/100\n\n"
          msg += scores

          ok = send_telegram(msg, parse_mode="HTML")
          print("Telegram notification sent" if ok else "Telegram notification skipped/failed")
          PY
