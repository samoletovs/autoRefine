name: "autoRefine — PR approval cards"

# Sweeps open Copilot PRs across all projects and, once a PR is ready (not a draft) and
# its CI is green, sends a Telegram card with [✅ Approve & merge] [❌ Close]. nauroBot turns
# a 👍 tap into an approve + squash-merge and a 👎 into a close. This is the PR half of the
# idea → build → merge loop; the idea half lives in autorefine-evaluate.yml.
#
# Near-read-only: the only write is a `pr-card-sent` label so a PR is carded once. The
# approve/merge happens in nauroBot on the tap, so this needs only a PAT + the bot secrets.
#
# Required secrets: GH_PAT (cross-repo PR read + label write), NAURO_BOT_TOKEN, NAURO_CHAT_ID.

on:
  schedule:
    # Three sweeps a day (UTC): 07, 13, 19 — roughly morning, midday, evening.
    # Most runs are no-ops; a card is only sent when a ready, green Copilot PR
    # appears, and the PR janitor is what actually keeps merges moving. This
    # sweep only decides how soon the card reaches the phone, so its cadence
    # buys latency, not correctness.
    #
    # It ran two-hourly (nine sweeps a day, 270 runs a month) and was invisible
    # to the budget while it did: cronspec could not read a `6-22/2` range and
    # returned None, which callers treat as "leave it alone", so the single
    # largest scheduled line in this repo was priced at zero. Four-hourly removed
    # 120 runs/month. Measured against real job billing it was still the largest
    # line here at ~223 billed min/month — every sweep pays a whole minute for a
    # few seconds of API calls, because GitHub rounds each job up. Three a day
    # halves that again for at most an eight-hour wait on a notification that is
    # already backed by the janitor's own Telegram alert.
    - cron: '0 7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-cards:
    runs-on: ubuntu-latest
    # Skip scheduled runs when the budget tier is "critical" (manual dispatch still works).
    if: vars.AUTOREFINE_TIER != 'critical' || github.event_name == 'workflow_dispatch'
    env:
      NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
      NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
    steps:
      - name: Checkout autoRefine
        uses: actions/checkout@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Checkout governance (for manifest)
        uses: actions/checkout@v5
        with:
          repository: samoletovs/nauroLabs-github
          path: .github-gov
          token: ${{ secrets.GH_PAT }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sweep and card ready Copilot PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python -m agent.main \
            --manifest .github-gov/config/workspace-manifest.json \
            --mode pr-cards

      - name: Failure notification
        if: failure()
        run: |
          if [ -z "$NAURO_BOT_TOKEN" ] || [ -z "$NAURO_CHAT_ID" ]; then
            echo "NAURO_BOT_TOKEN or NAURO_CHAT_ID not set; skipping"
            exit 0
          fi
          curl -sf -X POST "https://api.telegram.org/bot${NAURO_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NAURO_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=❌ <b>autoRefine pr-cards</b> failed — see the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::Telegram failure notification did not send"
