name: "autoRefine — PR approval cards"

# Sweeps open Copilot PRs across all projects and, once a PR is ready (not a draft) and
# its CI is green, sends a Telegram card with [✅ Approve & merge] [❌ Close]. nauroBot turns
# a 👍 tap into an approve + squash-merge and a 👎 into a close. This is the PR half of the
# idea → build → merge loop; the idea half lives in autorefine-evaluate.yml.
#
# Near-read-only: the only write is a `pr-card-sent` label so a PR is carded once. The
# approve/merge happens in nauroBot on the tap, so this needs only a PAT + the bot secrets.
#
# Required secrets: GH_PAT (cross-repo PR read + label write), NAURO_BOT_TOKEN, NAURO_CHAT_ID.

on:
  schedule:
    # One sweep a day (UTC 19:00). A second, free sweep runs at ~06:00 as the last
    # step of the daily health scan — see below.
    #
    # This cannot be event-driven, and that is not a cadence choice. The sweep reads
    # open PRs across every project in the workspace manifest (agent/pr_cards.py takes
    # a repo list), and GitHub delivers `pull_request` / `check_suite` events only to
    # workflows living in the repo where the event happened. Making it event-driven
    # would mean installing a `repository_dispatch` forwarder in all 23 other repos,
    # which is both outside this repo and a net cost increase: every PR event would
    # then fire a forwarder run *there* plus a sweep run here.
    #
    # So the only lever is run count, and run count is the whole bill: GitHub rounds
    # each job up to a full minute, and this job's real work is a few seconds of API
    # calls, so 230 runs cost 230 minutes. It has come down 9/day → 4/day → 3/day on
    # that logic; this takes the scheduled part to 1/day and recovers the lost latency
    # for free by appending the same sweep to the health-scan job, which is already
    # running and already paid for.
    #
    # Latency is the only thing cadence buys here. Nothing waits on the card: the
    # governance PR janitor sweeps every 6h and merges anything that passes the gates,
    # and its stuck-PR watchdog escalates independently after 24h. The card is the
    # one-tap convenience path, not the mechanism.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-cards:
    runs-on: ubuntu-latest
    # The comment above is explicit that run count is the whole bill here because the
    # real work is seconds of API calls — observed runs finish in 0.2-0.6 min. That makes
    # the inherited 6-hour default absurd: one wedged API call could cost more billed
    # minutes than a year of scheduled sweeps. 10 min is ~16x the slowest run seen.
    timeout-minutes: 10
    # Skip scheduled runs when the budget tier is "critical" (manual dispatch still works).
    if: vars.AUTOREFINE_TIER != 'critical' || github.event_name == 'workflow_dispatch'
    env:
      NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
      NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
    steps:
      - name: Checkout autoRefine
        uses: actions/checkout@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Checkout governance (for manifest)
        uses: actions/checkout@v5
        with:
          repository: samoletovs/nauroLabs-github
          path: .github-gov
          token: ${{ secrets.GH_PAT }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sweep and card ready Copilot PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python -m agent.main \
            --manifest .github-gov/config/workspace-manifest.json \
            --mode pr-cards

      - name: Failure notification
        if: failure()
        run: |
          if [ -z "$NAURO_BOT_TOKEN" ] || [ -z "$NAURO_CHAT_ID" ]; then
            echo "NAURO_BOT_TOKEN or NAURO_CHAT_ID not set; skipping"
            exit 0
          fi
          curl -sf -X POST "https://api.telegram.org/bot${NAURO_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NAURO_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=❌ <b>autoRefine pr-cards</b> failed — see the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::Telegram failure notification did not send"
